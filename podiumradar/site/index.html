<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Podiumradar</title>
<meta name="description" content="Concerten, voorstellingen, tentoonstellingen en festivals in Nederland, rechtstreeks van de podia zelf.">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Podiumradar">
<meta name="theme-color" content="#2446F0">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<!-- Alleen eigen bestanden laden en uitvoeren: ook als er ooit iets vreemds in de gegevens van een bron staat -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  --paper:#EDEFF4; --card:#FFFFFF; --ink:#161A2C; --muted:#5B6178; --line:#D5D9E4;
  --pop:#2446F0; --pop-soft:#DCE2FF; --thea:#A32465; --thea-soft:#F7DCE9;
  --expo:#1F7A4D; --expo-soft:#D6EFE1; --fest:#B8560A; --fest-soft:#FBE3CF; --film:#5B3FB8; --film-soft:#E4DCFA;
  --kids:#0E7C86; --kids-soft:#D3F0F2;
  --star:#E89B00; --warn:#C43A1C;
  --map-sea:#D9E4F1; --map-nb:#E4E6EC; --map-land:#FFFFFF;
  --acc:var(--pop); --acc-soft:var(--pop-soft);
  --shadow:0 1px 2px rgba(22,26,44,.05),0 2px 10px rgba(22,26,44,.05);
  --shadow-up:0 2px 4px rgba(22,26,44,.06),0 10px 26px rgba(22,26,44,.10);
  --glass:rgba(237,239,244,.82); --glass-card:rgba(255,255,255,.86);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#10131F; --card:#1A1E2E; --ink:#EEF0F7; --muted:#9AA0B8; --line:#2C3147;
    --pop:#6F86FF; --pop-soft:#232B55; --thea:#E0679F; --thea-soft:#48213A; --star:#FFB829; --warn:#FF7A5C;
    --expo:#4CC38A; --expo-soft:#1B3A2B; --fest:#F2934A; --fest-soft:#46301D; --film:#A48BFF; --film-soft:#2E2552; --kids:#3CC7D1; --kids-soft:#163A3D; --map-sea:#0A0F1C; --map-nb:#141824; --map-land:#252B44;
    --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-up:0 4px 18px rgba(0,0,0,.45); --glass:rgba(16,19,31,.80); --glass-card:rgba(26,30,46,.86);
  }
}
:root[data-theme="dark"]{
  --paper:#10131F; --card:#1A1E2E; --ink:#EEF0F7; --muted:#9AA0B8; --line:#2C3147;
  --pop:#6F86FF; --pop-soft:#232B55; --thea:#E0679F; --thea-soft:#48213A; --star:#FFB829; --warn:#FF7A5C;
  --expo:#4CC38A; --expo-soft:#1B3A2B; --fest:#F2934A; --fest-soft:#46301D; --film:#A48BFF; --film-soft:#2E2552; --kids:#3CC7D1; --kids-soft:#163A3D; --map-sea:#0A0F1C; --map-nb:#141824; --map-land:#252B44;
  --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-up:0 4px 18px rgba(0,0,0,.45); --glass:rgba(16,19,31,.80); --glass-card:rgba(26,30,46,.86);
}
body.thea{--acc:var(--thea); --acc-soft:var(--thea-soft);}
body.expo{--acc:var(--expo); --acc-soft:var(--expo-soft);}
body.film{--acc:var(--film); --acc-soft:var(--film-soft);}
body.kids{--acc:var(--kids); --acc-soft:var(--kids-soft);}
body.fest{--acc:var(--fest); --acc-soft:var(--fest-soft);}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;
  font-variation-settings:"wdth" 100;-webkit-font-smoothing:antialiased;padding-bottom:84px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:6px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);padding:12px 16px 8px;border-bottom:1px solid var(--line);transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .2s}
/* ingeklapt bij scrollen (app.js): schuift omhoog tot alleen de datumrij over is */
header.tuck{transform:translateY(calc(-1 * var(--tuck,0px)))}
header.scrolled{box-shadow:0 6px 18px rgba(10,12,24,.08)}
@media (prefers-reduced-motion:reduce){header{transition:none}}
/* strook boven de kop (notch) afdekken, zodat de ingeklapte kop daar niet doorheen schemert */
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:25}
.top{display:flex;align-items:center;gap:8px 12px;justify-content:space-between;flex-wrap:wrap}
.brand{font-weight:800;font-size:26px;letter-spacing:-.02em;font-variation-settings:"wdth" 70;line-height:1}
.brand span{display:inline-block;position:relative;width:10px;height:10px;border-radius:50%;background:var(--acc);margin-left:3px;vertical-align:4px;transition:background .3s}
.brand span::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--acc);animation:ping 2.6s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{0%{transform:scale(1);opacity:.7}80%,100%{transform:scale(2.8);opacity:0}}
@media (prefers-reduced-motion:reduce){.brand span::after{animation:none;opacity:0}}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 11px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);transition:background .2s,color .2s}
@media (max-width:420px){.seg button{padding:6px 7px;font-size:13px}}
.seg{max-width:100%;overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}.seg button{flex:0 0 auto}
.seg button[aria-pressed="true"]{background:var(--acc);color:#fff;box-shadow:0 2px 8px color-mix(in srgb,var(--acc) 40%,transparent)}
.searchrow{display:flex;gap:8px;margin-top:12px}
.search{flex:1;display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px;color:var(--muted);transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.search input{border:0;background:none;outline:none;padding:10px 6px;width:100%;font-size:16px;color:var(--ink)}
.fbtn{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:0 14px;font-weight:600;font-size:14px;position:relative}
.fbtn b{position:absolute;top:-6px;right:-6px;background:var(--acc);color:#fff;font-size:11px;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.fbtn b[hidden]{display:none}
.dates{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:5px 0;width:50px;text-align:center;line-height:1.1;transition:background .15s,color .15s,transform .1s}
.day:active{transform:scale(.95)}
.day small{display:block;font-size:11px;color:var(--muted)}
.day strong{font-size:18px;font-variation-settings:"wdth" 80}
.day.all{width:auto;padding:5px 12px;font-weight:600;font-size:14px;display:grid;place-items:center}
.day[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.day[aria-pressed="true"] small{color:inherit;opacity:.75}
.day.we{border-bottom:3px solid var(--acc)}
.mlab{flex:0 0 auto;align-self:center;writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);padding:0 2px;border-right:2px solid var(--acc-soft);margin:0 2px 0 4px}

main{padding:4px 16px 24px;max-width:860px;margin:0 auto}
.meta{display:flex;justify-content:space-between;align-items:baseline;color:var(--muted);font-size:13px;padding:10px 0 2px}
.meta button{border:0;background:none;color:var(--acc);font-weight:600;font-size:13px;padding:0}
h2.dh{font-size:15px;font-weight:700;margin:24px 0 10px;display:flex;gap:8px;align-items:baseline}
h2.dh::before{content:"";flex:0 0 auto;width:4px;height:14px;border-radius:2px;background:var(--acc);align-self:flex-start;margin-top:4px}
h2.dh small{font-weight:400;color:var(--muted)}
h2.mh{display:flex;align-items:center;gap:12px;font-size:26px;font-weight:800;letter-spacing:-.02em;font-variation-settings:"wdth" 72;line-height:1.1;margin:34px 0 0}
h2.mh::after{content:"";flex:1;height:2px;border-radius:1px;background:var(--line)}
.meta+h2.mh{margin-top:16px}
.months{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:5px 33px 5px 5px;margin:9px -5px -3px;scroll-padding-inline:5px 33px;position:relative;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.months::-webkit-scrollbar{display:none}
@media (pointer:fine){.months{cursor:grab}}
.months.dragging{cursor:grabbing;user-select:none}
.months .chip{flex:0 0 auto;display:inline-flex;align-items:baseline;gap:5px;padding:6px 12px;font-weight:600}
.months .chip small{font-size:11px;font-weight:500;color:var(--muted)}
.months .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);box-shadow:none}
.months .chip[aria-pressed="true"] small{color:inherit;opacity:.75}
.btn.more{width:100%;margin:8px 0 4px;padding:13px 14px}
.scope{margin-top:12px}
.btn.ghost svg{flex:0 0 auto}
.btn.more small{font-weight:500;color:var(--muted)}
.ev{box-sizing:border-box;display:grid;grid-template-columns:66px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 6px 10px 10px;margin-bottom:10px;text-align:left;width:100%;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s ease,box-shadow .2s ease,border-color .2s ease}
@media (hover:hover){.ev:hover{box-shadow:var(--shadow-up);border-color:color-mix(in srgb,var(--acc) 35%,var(--line))}}
.ev:active{transform:scale(.985)}
@media (prefers-reduced-motion:reduce){.ev{transition:none}.ev:active{transform:none}}
.ev .t{font-weight:800;font-size:20px;font-variation-settings:"wdth" 70;line-height:1;align-self:center;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:var(--acc-soft);color:var(--acc);border-radius:11px;padding:10px 4px;min-height:58px}
.ev .t small{display:block;font-weight:600;font-size:10.5px;margin-top:4px;font-variation-settings:"wdth" 90}
.ev>div{min-width:0;overflow-wrap:anywhere}
.ev .a{hyphens:auto;-webkit-hyphens:auto}
.ev .a{font-weight:700;font-size:17px;line-height:1.2;letter-spacing:-.01em}
.ev .s{font-size:13px;color:var(--muted)}
.ev .v{font-size:13px;margin-top:2px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--acc-soft);color:var(--acc);margin-right:4px;margin-top:4px}
.tag.sold{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.star{border:0;background:none;font-size:22px;line-height:1;padding:6px;color:var(--line);transition:color .2s,transform .2s}
.star:active{transform:scale(1.3)}
.star[aria-pressed="true"]{color:var(--star)}
@media (max-width:380px){.ev{gap:8px}.ev .a{font-size:16px}.ev .star{padding:6px 2px}}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.empty button{margin-top:12px}

/* schema */
@media (pointer:fine){.grid-wrap,.dates{cursor:grab}}
.grid-wrap.dragging,.dates.dragging{cursor:grabbing;user-select:none}
.grid-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--card);margin-top:10px;box-shadow:var(--shadow)}
.grid{position:relative;min-width:calc(120px + var(--hours)*96px)}
.ruler,.lane{display:grid;grid-template-columns:120px 1fr}
.ruler{position:sticky;top:0;border-bottom:1px solid var(--line);background:var(--card);z-index:2}
.ruler .hrs{position:relative;height:30px}
.ruler .hrs span{position:absolute;top:7px;font-size:12px;font-weight:600;color:var(--muted);transform:translateX(-50%)}
.lane{border-bottom:1px solid var(--line);min-height:74px}
.lane:last-child{border-bottom:0}
.vname{position:sticky;left:0;background:var(--card);z-index:1;padding:10px;border-right:1px solid var(--line);font-size:13px;line-height:1.2}
.vname b{display:block;font-size:14px}
.vname small{color:var(--muted)}
.track{position:relative;background-image:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 96px)}
.blk{position:absolute;top:10px;bottom:10px;border-radius:8px;padding:6px 8px;overflow:hidden;font-size:12px;line-height:1.2;border:0;text-align:left;color:var(--ink)}
.blk b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.main{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 78%,#000));color:#fff;box-shadow:0 2px 6px color-mix(in srgb,var(--acc) 35%,transparent)}
.blk.sup{background:var(--acc-soft);color:var(--acc)}
.blk.door{background:repeating-linear-gradient(135deg,var(--line) 0 4px,transparent 4px 8px);color:var(--muted)}
.blk.fav{box-shadow:inset 0 0 0 3px var(--star)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--glass-card);-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;border:0;background:none;padding:8px 0 10px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:52px;height:30px;padding:4px 15px;border-radius:999px;transition:background .2s,color .2s}
nav.tabs button[aria-current="page"]{color:var(--acc)}
nav.tabs button[aria-current="page"] svg{background:var(--acc-soft)}
body.venues header .seg,body.tonight header .seg{display:none}
.vkinds{margin-top:10px}
.vhead{padding:6px 0 4px}.vhead h1{font-size:32px;font-weight:800;letter-spacing:-.02em;font-variation-settings:"wdth" 72;margin:0 0 6px;line-height:1.05}
.ev.venue .t{font-variant-numeric:tabular-nums}
.linkbtn{border:0;background:none;padding:0;color:var(--acc);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,12,24,.45);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);z-index:40;display:none}
.scrim.open{display:block}
html:has(#scrim.open){overflow:hidden}
.sheet{overscroll-behavior:contain}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--paper);border-radius:24px 24px 0 0;max-height:88%;overflow-y:auto;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(10,12,24,.18);padding:8px 18px calc(24px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto}
.sheet.open{transform:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
/* Sluitbalk bovenaan elk scherm: blijft staan bij scrollen */
.sheetbar{position:sticky;top:-8px;z-index:3;height:54px;margin:-8px -18px 2px;background:var(--paper);border-radius:24px 24px 0 0}
.sheetbar .grab{position:absolute;top:12px;left:50%;margin:0;transform:translateX(-50%)}
.sheetx{position:absolute;left:12px;top:9px;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px 0 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;font-size:14px;box-shadow:var(--shadow);transition:transform .1s}
.sheetx:active{transform:scale(.95)}
.sheet h3{font-size:14px;margin:18px 0 8px;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;transition:background .15s,border-color .15s,color .15s}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
select.sel{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.row2{display:flex;gap:10px;margin-top:22px}
.btn{flex:1;border:0;border-radius:14px;padding:12px 14px;font-weight:700;background:var(--acc);color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 30%,transparent);transition:transform .1s,filter .15s;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.97)}
@media (hover:hover){.btn:hover{filter:brightness(1.06)}}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.toggle[hidden]{display:none}
.locbar{display:flex;gap:8px;align-items:center}.locbar .sel{flex:1;min-width:0}.locbar .btn{flex:0 0 auto;padding:10px 12px}
.loclist{max-height:340px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;margin-top:8px;background:var(--card)}
.loclist details{border-bottom:1px solid var(--line)}.loclist details:last-child{border-bottom:0}
.loclist summary{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;list-style:none}
.loclist summary::-webkit-details-marker{display:none}
.loclist summary::after{content:"›";margin-left:auto;color:var(--muted);transition:transform .15s}
.loclist details[open] summary::after{transform:rotate(90deg)}
.loclist .cnt{color:var(--muted);font-size:13px}
.loclist label.v{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 38px;font-size:14px}
.loclist input{width:18px;height:18px;accent-color:var(--acc);flex:0 0 auto}
.loclist .off{opacity:.45}
.toggle input{width:20px;height:20px;accent-color:var(--acc)}

/* detail */
.dhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dhead>div,.dhead>h1{min-width:0;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
.dtitle{font-size:36px;font-weight:800;line-height:1;letter-spacing:-.02em;font-variation-settings:"wdth" 72;margin:4px 0 8px;text-wrap:balance}
.dhead>div>.dsub:first-child{font-weight:600;color:var(--acc)}
.dsub{color:var(--muted);font-size:14px}
.timeline{margin:16px 0 4px;border-left:2px solid var(--line);padding-left:14px}
.slot{position:relative;padding:6px 0}
.slot::before{content:"";position:absolute;left:-20px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--muted)}
.slot.key::before{background:var(--acc);border-color:var(--acc)}
.slot time{font-weight:800;font-variation-settings:"wdth" 75;margin-right:8px}
.facts{display:flex;flex-wrap:wrap;gap:10px 18px;margin:14px 0;font-size:14px}
.facts{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.facts div small{display:block;color:var(--muted);font-size:12px}
.facts div b{font-size:17px}
.simlist .ev{grid-template-columns:1fr auto}
.ai{background:var(--card);border:1px dashed var(--acc);border-radius:12px;padding:12px;margin-top:10px;font-size:14px}
.ai p{margin:6px 0}
.note{font-size:12px;color:var(--muted);margin-top:18px}
.note a{color:var(--acc)}
/* Kleine gekleurde tekst iets naar de tekstkleur trekken: leesbaar (AA) in elke soortkleur, licht en donker */
@supports (color:color-mix(in srgb,red 50%,blue)){
  .ev .t,.tag{color:color-mix(in srgb,var(--acc) 85%,var(--ink))}
  .mlab,.note a{color:color-mix(in srgb,var(--acc) 80%,var(--ink))}
}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);box-shadow:var(--shadow-up);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.favhead{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.favchip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-size:14px;font-weight:600}
.favchip button{border:0;background:var(--line);border-radius:50%;width:22px;height:22px;line-height:1;font-size:13px}
.demo{background:var(--acc-soft);color:var(--acc);font-size:12px;border-radius:8px;padding:8px 10px;margin-top:10px}

.ev .tt{font-size:12px;color:var(--muted);margin-top:2px}
.new{display:inline-block;font-size:10px;font-weight:800;background:var(--star);color:#1a1200;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.home{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-top:8px}
.home select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 6px;font-size:13px;color:var(--ink)}
.home button{border:0;background:none;color:var(--acc);font-weight:600;font-size:13px;padding:0}
.banner{background:var(--card);border:1px solid var(--star);border-left:4px solid var(--star);border-radius:14px;padding:12px;margin-top:14px;font-size:14px}
.banner strong{display:block;margin-bottom:4px}
.alarmrow{display:flex;gap:8px;margin-top:8px}
.alarmrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 10px;font-size:16px}
.alarmrow button{flex:0 0 auto}
.unk{margin-top:14px}
.unk h3{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 6px}
.est{font-size:11px;color:var(--muted)}
/* soort-label, prijs */
.tag.kind{background:var(--acc);color:#fff}
.tag.price{background:transparent;border:1px solid var(--line);color:var(--ink)}
.tag.price.free{border-color:var(--expo);color:var(--expo)}
/* vanavond in de buurt */
.tncta{display:flex;align-items:center;gap:12px;width:100%;margin-top:14px;text-align:left;color:#fff;border:0;border-radius:18px;padding:14px 16px;background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--acc) 85%,#fff) 0%,transparent 55%),linear-gradient(135deg,#1B2140,#2A1F55);box-shadow:0 8px 24px rgba(27,33,64,.25);transition:transform .12s}
.tncta:active{transform:scale(.985)}
.tncta svg{flex:0 0 auto;width:40px;height:40px;padding:9px;border-radius:12px;background:rgba(255,255,255,.14)}
.tncta span{flex:1;line-height:1.3}.tncta b{display:block;font-size:17px}.tncta small{color:rgba(255,255,255,.75);font-size:13px}
.tncta i{font-style:normal;font-size:26px;color:rgba(255,255,255,.7)}
.tnbar{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px}
.tnkinds{margin-top:8px}
.tnbar .chip,.tnkinds .chip{padding:5px 11px;font-size:13px}
.tnkinds .chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.tnkinds .chip[aria-pressed="false"]{color:var(--muted);text-decoration:line-through}
.tnper{margin-top:18px;border-top:1px solid var(--line);padding-top:6px}
.tnper summary{font-size:15px;font-weight:700;padding:10px 0;cursor:pointer}
.tnper summary small{font-weight:400;color:var(--muted)}
/* podia volgen */
.star.big{font-size:30px;padding:2px 4px}
.vhead .dhead{align-items:center}
.vfav{margin:10px 0 16px}
.vfavh{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;margin-bottom:6px}
.vfavh .linkbtn{font-size:16px;text-decoration:none}
.vfavh .s{flex:1;font-size:13px;color:var(--muted)}
.vfavh .star{font-size:20px;padding:2px}
.newtxt{color:var(--star)}
/* kaart */
.vbar{display:flex;align-items:flex-start;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;margin-top:10px}
.vbar .vkinds{margin-top:0}
.vmode button{padding:5px 14px}
.mapbox{position:relative;width:100%;aspect-ratio:1000/1208;max-height:calc(100vh - 290px);min-height:320px;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;background:var(--map-sea)}
.mapbox svg{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.mapbox svg.dragging{cursor:grabbing}
.m-sea{fill:var(--map-sea)}
.m-nb{fill:var(--map-nb);stroke:var(--map-nb)}
.m-land{fill:var(--map-land);stroke:var(--muted);stroke-linejoin:round}
.m-prov{fill:none;stroke:var(--line);stroke-linejoin:round}
.m-dot{fill-opacity:.82;stroke:var(--card);cursor:pointer}
.m-dot:hover{fill-opacity:1}
.m-dot.fav{stroke:var(--star);fill-opacity:1}
.m-lbl{fill:var(--ink);font-weight:600;paint-order:stroke;stroke:var(--card);stroke-linejoin:round;pointer-events:none}
.m-home{pointer-events:none}.m-home circle{fill:none;stroke:var(--ink)}
.m-home text{fill:var(--ink);font-weight:800;paint-order:stroke;stroke:var(--card);stroke-linejoin:round;pointer-events:none}
.mapbtns{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mapbtns button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:20px;font-weight:700;line-height:1;box-shadow:0 2px 8px rgba(10,12,24,.12)}
.mapbtns button[data-zoom="all"]{font-size:13px}
.legend i.dot{width:11px;height:11px;border-radius:50%}
.legend i.dot.home{border:2px solid var(--ink);background:none}
/* installatiehulp (pwa.js) */
.installbar{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:35;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:14px;padding:10px 8px 10px 12px;font-size:13px;box-shadow:0 6px 20px rgba(10,12,24,.15)}
.installbar>div{flex:1;line-height:1.35}
.installbar strong{display:block;font-size:14px}
.installbar .btn{flex:0 0 auto;padding:8px 12px;font-size:13px}
.installbar .x{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:4px 6px}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">Podiumradar<span></span></div>
    <div class="seg" role="group" aria-label="Soort">
      <button data-type="pop" aria-pressed="true">Concerten</button>
      <button data-type="thea" aria-pressed="false">Theater</button>
      <button data-type="film" aria-pressed="false">Film</button>
      <button data-type="expo" aria-pressed="false">Musea</button>
      <button data-type="fest" aria-pressed="false">Festivals</button>
      <button data-type="kids" aria-pressed="false">Kids</button>
    </div>
  </div>
  <div class="searchrow">
    <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Zoek artiest, podium of stad" aria-label="Zoeken"></label>
    <button class="fbtn" id="openFilters">Filters<b id="fcount" hidden>0</b></button>
  </div>
  <div class="home"><span>Vanaf</span><select id="homeSel" aria-label="Vertrekpunt"></select><button id="geoBtn">Mijn locatie</button></div>
  <div class="dates" id="dates" role="group" aria-label="Datum"></div>
</header>
<main id="main"></main>
<nav class="tabs" aria-label="Weergave">
  <button data-view="list" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Agenda</button>
  <button data-view="grid"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg>Blokkenschema</button>
  <button data-view="venues"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Podia</button>
  <button data-view="fav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>Voor jou<b id="newDot" hidden style="position:absolute;margin-left:34px;margin-top:2px;width:8px;height:8px;border-radius:50%;background:var(--star)"></b></button>
</nav>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="filterSheet" aria-label="Filters" role="dialog">
  <div class="sheetbar"><button class="sheetx" type="button" data-close><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>Sluiten</button><div class="grab"></div></div>
  <div class="dhead"><strong style="font-size:20px">Filters</strong><button class="btn ghost" style="flex:0" id="resetF">Wissen</button></div>
  <h3>Sorteren</h3><div class="chips" id="fSort"></div>
  <h3>Reistijd vanaf je vertrekpunt</h3><div class="chips" id="fTravel"></div>
  <h3>Regio</h3><div class="chips" id="fRegio"></div>
  <h3>Podium</h3><select class="sel" id="fVenue"></select>
  <h3>Steden en podia <small class="s" style="font-weight:400">vink uit wat je niet wilt zien</small></h3>
  <div class="locbar"><input class="sel" id="fLocQ" type="search" placeholder="Zoek stad of podium" aria-label="Zoek stad of podium"><button class="btn ghost" id="fLocAll" type="button">Alles aan</button></div>
  <div class="loclist" id="fLoc"></div>
  <h3>Genre</h3><div class="chips" id="fGenre"></div>
  <h3>Tijd</h3><div class="chips" id="fTime"></div>
  <div style="margin-top:14px"><label class="toggle">Alleen favorieten (artiesten en podia die je volgt) <input type="checkbox" id="fOnlyFav"></label>
  <label class="toggle">Alleen gratis <input type="checkbox" id="fOnlyFree"></label>
  </div>
  <div class="row2"><button class="btn" id="applyF">Toon resultaten</button></div>
</section>
<section class="sheet" id="detailSheet" aria-label="Details" role="dialog"></section>
<div class="toast" id="toast" role="status"></div>
<script src="app.js"></script>
<script src="pwa.js"></script>
</body>
</html>
