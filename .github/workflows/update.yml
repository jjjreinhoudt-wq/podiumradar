name: Agenda bijwerken

on:
  schedule:
    - cron: "7 1 * * *"  # 03:07 NL-zomertijd; niet op een heel of half uur, dan is GitHub druk en start hij uren later
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["podiumradar/site/**", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Nieuwe naam: run #35 (6 okt) bleef op 'waiting' hangen en liet zich niet annuleren; in de oude wachtrij 'podiumradar' blokkeerde hij alle runs erachter
  group: podiumradar-bijwerken
  cancel-in-progress: false

jobs:
  scrape:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: podiumradar
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - run: python -u scraper/scrape.py
      - name: Meldingen versturen
        # Pushmeldingen via ntfy bij nieuwe shows van gevolgde artiesten/podia; zonder secret NTFY_TOPIC doet dit niets
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -u scraper/meldingen.py || echo "Meldingen mislukt (agenda is wel bijgewerkt)"
      - name: Wijzigingen opslaan
        run: |
          git config user.name "podiumradar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A site scraper
          # Tijdens een lange run kan er intussen iets op main zijn gezet: eerst bijwerken, dan pushen
          git diff --cached --quiet || (git commit -m "Agenda bijgewerkt" && git pull --rebase -X theirs origin main && git push)

  deploy:
    needs: scrape
    if: always() && (needs.scrape.result == 'success' || needs.scrape.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: main
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: podiumradar/site
      - id: d
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
