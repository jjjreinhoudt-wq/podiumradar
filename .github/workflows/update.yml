name: Agenda bijwerken

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["podiumradar/site/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: podiumradar
  cancel-in-progress: false

jobs:
  scrape:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: podiumradar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - run: python scraper/scrape.py
      - name: Wijzigingen opslaan
        run: |
          git config user.name "podiumradar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A site scraper
          # Tijdens een lange run kan er intussen iets op main zijn gezet: eerst bijwerken, dan pushen
          git diff --cached --quiet || (git commit -m "Agenda bijgewerkt" && git pull --rebase -X theirs origin main && git push)

  deploy:
    needs: scrape
    if: always() && (needs.scrape.result == 'success' || needs.scrape.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: podiumradar/site
      - id: d
        uses: actions/deploy-pages@v4
