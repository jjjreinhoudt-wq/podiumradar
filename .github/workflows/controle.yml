name: Wekelijkse controle

# Elke maandagochtend: kijkt of bronnen stuk lijken (0 items, sterke daling, 403/404, vreemde datums/tijden ...)
# en zet het rapport in één vast issue "Wekelijkse controle Podiumradar". GitHub stuurt de eigenaar daarvan een mail.
on:
  schedule:
    - cron: "17 6 * * 1"  # maandag 06:17 UTC; niet op een heel of half uur
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  controle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: podiumradar
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0  # git-geschiedenis nodig om met vorige week te vergelijken
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Rapport maken
        run: python scraper/controle.py --uit "$RUNNER_TEMP/controle.md"
      - name: Issue bijwerken
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          titel="Wekelijkse controle Podiumradar"
          gh label create controle --color FBCA04 --description "Wekelijkse controle van de bronnen" 2>/dev/null || true
          nr=$(gh issue list --label controle --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$nr" ]; then
            gh issue create --title "$titel" --label controle --body-file "$RUNNER_TEMP/controle.md"
          else
            # Bovenaan het issue staat altijd het nieuwste rapport; de reactie zorgt voor de mail
            gh issue edit "$nr" --body-file "$RUNNER_TEMP/controle.md"
            gh issue comment "$nr" --body-file "$RUNNER_TEMP/controle.md"
          fi
