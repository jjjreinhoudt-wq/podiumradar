name: Volglijst bijwerken

# De app opent een vooringevulde GitHub-melding "Volglijst Podiumradar" met de artiesten, podia en alarmen
# die Jasper volgt. Deze workflow zet die in scraper/volgen.json (voor de pushmeldingen via ntfy) en sluit
# de melding. Alleen meldingen van de eigenaar van de repository worden overgenomen.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: volglijst
  cancel-in-progress: false

jobs:
  bijwerken:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'Volglijst Podiumradar')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Volglijst overnemen
        # De tekst van de melding wordt alleen als JSON-bestand gelezen, nooit in de shell gezet
        run: python -u podiumradar/scraper/volglijst.py "$GITHUB_EVENT_PATH"
      - name: Opslaan en melding sluiten
        env:
          GH_TOKEN: ${{ github.token }}
          NR: ${{ github.event.issue.number }}
        run: |
          git config user.name "podiumradar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add podiumradar/scraper/volgen.json
          git diff --cached --quiet || (git commit -m "Volglijst bijgewerkt" && git pull --rebase -X theirs origin main && git push)
          gh issue comment "$NR" --body "Volglijst overgenomen. Je krijgt meldingen bij nieuwe shows van wie je volgt." --repo "$GITHUB_REPOSITORY"
          gh issue close "$NR" --repo "$GITHUB_REPOSITORY"
